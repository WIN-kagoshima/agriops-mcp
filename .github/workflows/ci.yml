name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify npm package signatures
        run: npm audit signatures
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit + smoke + conformance tests
        run: npm test

      - name: Eval scenario suite
        run: npm run test:scenarios

      - name: Secret leakage guard (grep for committed secrets)
        run: |
          set -e
          # Refuse to ship the .env file by accident.
          if [ -f .env ]; then
            echo "::error file=.env::Refusing to ship committed .env file"
            exit 1
          fi
          # Ensure no obvious AWS/Google/OpenAI secret prefixes leaked into source.
          if grep -RIn --include="*.ts" --include="*.json" --include="*.md" \
              -e "AKIA[0-9A-Z]\{16\}" \
              -e "sk-[A-Za-z0-9]\{32,\}" \
              -e "AIza[0-9A-Za-z_-]\{30,\}" \
              -e "BEGIN PRIVATE KEY" \
              -e "BEGIN OPENSSH PRIVATE KEY" \
              src/ tests/ scripts/ docs/ README*.md AGENTS.md CLAUDE.md 2>/dev/null \
              | grep -v "fake-secret\|do-not-leak\|EXAMPLE\|tests/conformance/secret-leakage" ; then
            echo "::error::Possible secret leakage in source"
            exit 1
          fi

      - name: Inspector smoke (stdio, hard gate)
        run: |
          npx --yes @modelcontextprotocol/inspector --cli node dist/server.js --stdio --method tools/list

  well-known-drift:
    name: .well-known/mcp-server.json drift (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate static Server Card snapshot
        run: npm run snapshot:well-known

      - name: Fail if the committed snapshot has drifted
        # .well-known/mcp-server.json is the public contract crawlers and
        # registries read without hitting the live endpoint (AGENTS.md
        # "What you must NOT do"). If this diffs, the default surface,
        # prompts, or resources changed without regenerating the snapshot —
        # run `npm run snapshot:well-known` locally and commit the result.
        run: |
          if ! git diff --exit-code -- .well-known/mcp-server.json; then
            echo "::error file=.well-known/mcp-server.json::Committed Server Card snapshot is stale. Run 'npm run snapshot:well-known' and commit the diff."
            exit 1
          fi

  workflow-lint:
    name: GitHub Actions workflow lint (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Catches schema errors (e.g. using the `secrets` context in a
      # step-level `if:`, which is rejected by GitHub with zero jobs
      # scheduled and no useful log — see the v1.15.6 -> v1.15.7 incident
      # in CHANGELOG.md) *before* a tag push discovers them the hard way.
      - name: actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

  ui-tests:
    name: UI (Playwright)  EPhase 5+
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build UI bundle
        run: npm run build:ui

      - name: Playwright UI tests
        run: npm run test:ui
