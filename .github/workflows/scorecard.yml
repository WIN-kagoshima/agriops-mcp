name: OSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run analysis
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        if: hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      - name: Surface Scorecard analysis status
        if: steps.scorecard.outcome != 'success'
        run: |
          echo "::warning::OSSF Scorecard 'Run analysis' step finished with outcome=${{ steps.scorecard.outcome }}. SARIF was uploaded if it was generated. Trigger 'workflow_dispatch' to retry, and check upstream scorecard-action issues if this persists."
