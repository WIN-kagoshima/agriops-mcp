name: Release

# Triggered by pushing a SemVer-prefixed tag (e.g. `v0.5.0`).
# Builds the package, runs the full test suite, builds the UI bundle,
# publishes a GitHub Release with the dashboard.html attached, and — for
# stable (non-prerelease) tags — publishes to npm via **npm trusted
# publishing** (OIDC, no long-lived NPM_TOKEN). This requires the package to
# be configured as a Trusted Publisher for this exact repo + workflow file at
# https://www.npmjs.com/package/@sugukuru/agriops-mcp/access (Publishing
# access tab) before the first trusted-publish run. See the
# public-release-hardening plan §5 for the migration rationale.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build, test, and release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing (OIDC token exchange) requires npm CLI
      # >= 11.5.1. Node 22's bundled npm may be older, so pin explicitly
      # rather than relying on whatever ships with the runner's Node install.
      - name: Ensure npm CLI supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$tag) does not match package.json version $pkg"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build server
        run: npm run build

      - name: Build UI bundle
        run: npm run build:ui

      - name: Release readiness check
        run: npm run release:check -- --tag "$GITHUB_REF_NAME"

      - name: Test
        run: npm test

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v ver="$version" '
            $0 ~ "^## \\["ver"\\]" { found=1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md)
          test -n "$(printf '%s' "$notes" | tr -d '[:space:]')" || {
            echo "::error::CHANGELOG.md has no release notes for $GITHUB_REF_NAME"
            exit 1
          }
          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp dist/ui/dashboard.html release-assets/agriops-mcp-dashboard-${GITHUB_REF_NAME}.html
          (cd dist && tar -czf "../release-assets/agriops-mcp-server-${GITHUB_REF_NAME}.tar.gz" .)
          shasum -a 256 release-assets/* > release-assets/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/agriops-mcp-dashboard-${{ github.ref_name }}.html
            release-assets/agriops-mcp-server-${{ github.ref_name }}.tar.gz
            release-assets/SHA256SUMS

      # actions/setup-node's `registry-url` input (above) writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc.
      # With no NODE_AUTH_TOKEN secret configured (the correct state for
      # trusted publishing — no long-lived token exists to set), that
      # placeholder expands to an empty string, but npm CLI still sees an
      # `_authToken` line as "auth is configured" and skips its own OIDC
      # exchange entirely, attempting a classic publish with empty
      # credentials instead. The registry then returns a misleading
      # `404 Not Found` (not the expected auth error) — see
      # https://github.com/npm/documentation/issues/1960 and
      # https://github.com/npm/cli/issues/8976. Deleting the stale
      # `_authToken` entry here (not skipping `registry-url` altogether,
      # which `npm ci`'s cache resolution still wants) restores npm's normal
      # "no usable token configured -> try OIDC" trusted-publishing path.
      #
      # Skipped when NPM_TOKEN (see below) is set: in that fallback mode we
      # *want* the `_authToken=${NODE_AUTH_TOKEN}` line so classic
      # token auth kicks in instead.
      - name: Remove setup-node's placeholder npm auth token (unblocks OIDC)
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: |
          npm config delete //registry.npmjs.org/:_authToken
          echo "npm --version: $(npm --version)"
          echo "id-token env present: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"
          echo "_authToken still configured: $(npm config get //registry.npmjs.org/:_authToken 2>/dev/null || echo '(unset)')"

      # Preferred path: npm trusted publishing (OIDC, no long-lived token).
      # The npm CLI detects the GitHub Actions OIDC environment
      # (permissions.id-token: write, above) and exchanges it for a
      # short-lived publish token directly with the registry, then attaches
      # build provenance automatically.
      #
      # Temporary fallback: as of 2026-07-22, OIDC trusted publishing for
      # this exact repo/workflow/package still fails with a registry-side
      # `ENEEDAUTH` despite every documented requirement being verified
      # correct on both the GitHub Actions side (npm >= 11.5.1, `id-token:
      # write`, no stale `_authToken`, `package.json#repository.url`
      # without the `git+` scheme) and the npmjs.com Trusted Publisher
      # config side (org/repo/workflow filename/environment all confirmed
      # matching, "Allow npm publish" checked) — consistent with open
      # upstream reports for scoped packages (npm/cli#8976, npm/cli#9088).
      # Per this repo's "Pragmatism over purity" principle
      # (.cursor/rules/01-design-principles.mdc), `NPM_TOKEN` — a
      # granular, package-scoped, 2FA-bypass-enabled access token — is
      # wired in as NODE_AUTH_TOKEN so releases are not blocked on an
      # upstream registry bug. Remove this fallback (and the `if` above)
      # once OIDC is confirmed working again; do not let both linger
      # indefinitely as an unreviewed permanent state.
      - name: Publish to npm (stable tags only)
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
