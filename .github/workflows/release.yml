name: Release

# Triggered by pushing a SemVer-prefixed tag (e.g. `v0.5.0`).
# Builds the package, runs the full test suite, builds the UI bundle,
# publishes a GitHub Release with the dashboard.html attached, and — for
# stable (non-prerelease) tags — publishes to npm via **npm trusted
# publishing** (OIDC, no long-lived NPM_TOKEN). This requires the package to
# be configured as a Trusted Publisher for this exact repo + workflow file at
# https://www.npmjs.com/package/@sugukuru/agriops-mcp/access (Publishing
# access tab) before the first trusted-publish run. See the
# public-release-hardening plan §5 for the migration rationale.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build, test, and release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing (OIDC token exchange) requires npm CLI
      # >= 11.5.1. Node 22's bundled npm may be older, so pin explicitly
      # rather than relying on whatever ships with the runner's Node install.
      - name: Ensure npm CLI supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$tag) does not match package.json version $pkg"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build server
        run: npm run build

      - name: Build UI bundle
        run: npm run build:ui

      - name: Release readiness check
        run: npm run release:check -- --tag "$GITHUB_REF_NAME"

      - name: Test
        run: npm test

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v ver="$version" '
            $0 ~ "^## \\["ver"\\]" { found=1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md)
          test -n "$(printf '%s' "$notes" | tr -d '[:space:]')" || {
            echo "::error::CHANGELOG.md has no release notes for $GITHUB_REF_NAME"
            exit 1
          }
          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp dist/ui/dashboard.html release-assets/agriops-mcp-dashboard-${GITHUB_REF_NAME}.html
          (cd dist && tar -czf "../release-assets/agriops-mcp-server-${GITHUB_REF_NAME}.tar.gz" .)
          shasum -a 256 release-assets/* > release-assets/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/agriops-mcp-dashboard-${{ github.ref_name }}.html
            release-assets/agriops-mcp-server-${{ github.ref_name }}.tar.gz
            release-assets/SHA256SUMS

      # Trusted publishing: no NODE_AUTH_TOKEN / NPM_TOKEN. The npm CLI
      # detects the GitHub Actions OIDC environment (permissions.id-token:
      # write, above) and exchanges it for a short-lived publish token
      # directly with the registry, then attaches build provenance
      # automatically. Required for every stable tag per the
      # public-release-hardening plan — not optional/env-gated like the
      # previous NPM_TOKEN-based step. Prerelease tags (`v1.2.3-beta.0`) are
      # still skipped: they exist for internal/Cloud Run testing, not for the
      # npm `latest`/public dist-tag.
      - name: Publish to npm (trusted publishing, stable tags only)
        if: ${{ !contains(github.ref_name, '-') }}
        run: npm publish --access public --provenance
