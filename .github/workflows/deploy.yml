name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1
  REPOSITORY: agriops-mcp
  SERVICE: agriops-mcp
  MCP_BASE_URL: ${{ secrets.MCP_BASE_URL }}
  GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
  GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
  SNAPSHOT_BUCKET: ${{ secrets.SNAPSHOT_BUCKET }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validate and normalise deployment inputs
        id: deploy-inputs
        run: |
          # Strip CR/LF that often sneak in when secrets are pasted with a trailing newline
          PROJECT_ID="$(printf '%s' "$PROJECT_ID" | tr -d '\r\n' | xargs)"
          MCP_BASE_URL="$(printf '%s' "$MCP_BASE_URL" | tr -d '\r\n' | xargs)"
          GCP_WIF_PROVIDER="$(printf '%s' "$GCP_WIF_PROVIDER" | tr -d '\r\n' | xargs)"
          GCP_DEPLOYER_SERVICE_ACCOUNT="$(printf '%s' "$GCP_DEPLOYER_SERVICE_ACCOUNT" | tr -d '\r\n' | xargs)"
          GCP_RUNTIME_SERVICE_ACCOUNT="$(printf '%s' "$GCP_RUNTIME_SERVICE_ACCOUNT" | tr -d '\r\n' | xargs)"
          SNAPSHOT_BUCKET="$(printf '%s' "$SNAPSHOT_BUCKET" | tr -d '\r\n' | xargs)"
          test -n "$PROJECT_ID" || { echo "GCP_PROJECT_ID secret is empty"; exit 1; }
          test -n "$MCP_BASE_URL" || { echo "MCP_BASE_URL secret is empty"; exit 1; }
          test -n "$GCP_WIF_PROVIDER" || { echo "GCP_WIF_PROVIDER secret is empty"; exit 1; }
          test -n "$GCP_DEPLOYER_SERVICE_ACCOUNT" || { echo "GCP_DEPLOYER_SERVICE_ACCOUNT secret is empty"; exit 1; }
          test -n "$GCP_RUNTIME_SERVICE_ACCOUNT" || { echo "GCP_RUNTIME_SERVICE_ACCOUNT secret is empty"; exit 1; }
          test -n "$SNAPSHOT_BUCKET" || { echo "SNAPSHOT_BUCKET secret is empty"; exit 1; }
          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "MCP_BASE_URL=$MCP_BASE_URL"
            echo "GCP_WIF_PROVIDER=$GCP_WIF_PROVIDER"
            echo "GCP_DEPLOYER_SERVICE_ACCOUNT=$GCP_DEPLOYER_SERVICE_ACCOUNT"
            echo "GCP_RUNTIME_SERVICE_ACCOUNT=$GCP_RUNTIME_SERVICE_ACCOUNT"
            echo "SNAPSHOT_BUCKET=$SNAPSHOT_BUCKET"
          } >> "$GITHUB_ENV"
          {
            echo "project_id=$PROJECT_ID"
            echo "mcp_base_url=$MCP_BASE_URL"
            echo "gcp_wif_provider=$GCP_WIF_PROVIDER"
            echo "gcp_deployer_service_account=$GCP_DEPLOYER_SERVICE_ACCOUNT"
            echo "gcp_runtime_service_account=$GCP_RUNTIME_SERVICE_ACCOUNT"
            echo "snapshot_bucket=$SNAPSHOT_BUCKET"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.deploy-inputs.outputs.gcp_wif_provider }}
          service_account: ${{ steps.deploy-inputs.outputs.gcp_deployer_service_account }}
          # Explicit project_id ensures the credentials file carries
          # quota_project_id, which Service Usage uses to authorize
          # cloudbuild.googleapis.com requests. Without it, gcloud falls back
          # to "no quota project" and Service Usage fails with
          # "user is forbidden from accessing the bucket [***_cloudbuild]".
          project_id: ${{ steps.deploy-inputs.outputs.project_id }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Pin gcloud project + quota project
        run: |
          gcloud config set core/project "$PROJECT_ID"
          gcloud config set billing/quota_project "$PROJECT_ID"
          echo "--- gcloud config ---"
          gcloud config list
          echo "--- effective active account ---"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'

      - name: Install smoke-test dependencies
        run: npm ci --ignore-scripts

      - name: Capture package version
        id: package
        run: |
          PKG_VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore snapshots from GCS for the freshness/integrity audit
        # Hard gate: download the real .sqlite + .manifest.json the deploy will
        # bake into the image (same objects cloudbuild.remote.yaml restores)
        # and audit *those*, not whatever may or may not be in the local repo
        # checkout. Previously this step audited an empty local snapshots/
        # directory and was continue-on-error — effectively a no-op. See the
        # public-release-hardening plan §4.
        run: |
          mkdir -p snapshots
          gcloud storage cp "gs://$SNAPSHOT_BUCKET/emaff-fude-kagoshima.sqlite" snapshots/emaff-fude-kagoshima.sqlite
          gcloud storage cp "gs://$SNAPSHOT_BUCKET/famic-pesticide-2026.sqlite" snapshots/famic-pesticide-2026.sqlite
          gcloud storage cp "gs://$SNAPSHOT_BUCKET/emaff-fude-kagoshima.sqlite.manifest.json" snapshots/emaff-fude-kagoshima.sqlite.manifest.json || echo "manifest_missing=emaff" >> "$GITHUB_ENV"
          gcloud storage cp "gs://$SNAPSHOT_BUCKET/famic-pesticide-2026.sqlite.manifest.json" snapshots/famic-pesticide-2026.sqlite.manifest.json || echo "manifest_missing=famic" >> "$GITHUB_ENV"

      - name: Backfill missing manifest(s) (pre-hard-gate bucket uploads)
        # Snapshots uploaded to SNAPSHOT_BUCKET before the manifest hard gate
        # existed (public-release-hardening plan §4) may have a `.sqlite` with
        # no companion `.manifest.json`. Rather than fail the deploy outright
        # for a data-lineage gap the runtime never needed before today,
        # reconstruct a schema-v1 manifest directly from the file on disk
        # (sha256, byte size, `sqlite3 SELECT COUNT(*)` row count, static
        # per-builder source/attribution) and best-effort persist it back to
        # the bucket so future deploys don't repeat this step.
        # `generatedAt` is "now" — the true original build date is unknown —
        # so operators should still refresh via `npm run snapshots:build` on
        # the normal cadence; this only unblocks *this* deploy honestly.
        if: env.manifest_missing != ''
        run: |
          backfill() {
            local sqlite="$1" table="$2" source="$3" attribution="$4"
            local manifest="${sqlite}.manifest.json"
            [ -f "$manifest" ] && return 0
            local bytes sha256 rows generated_at
            bytes=$(stat -c%s "$sqlite" 2>/dev/null || stat -f%z "$sqlite")
            sha256=$(sha256sum "$sqlite" | cut -d' ' -f1)
            rows=$(sqlite3 "$sqlite" "SELECT COUNT(*) FROM ${table};")
            generated_at=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
            cat > "$manifest" <<JSON
          {
            "schemaVersion": 1,
            "generatedAt": "${generated_at}",
            "builder": "$(basename "$sqlite" .sqlite)",
            "outputPath": "${sqlite}",
            "outputBytes": ${bytes},
            "outputSha256": "${sha256}",
            "rowCount": ${rows},
            "source": "${source}",
            "attribution": "${attribution}"
          }
          JSON
            echo "Backfilled ${manifest} (rowCount=${rows}, bytes=${bytes})"
            gcloud storage cp "$manifest" "gs://$SNAPSHOT_BUCKET/$(basename "$manifest")" \
              && echo "Persisted ${manifest} back to gs://$SNAPSHOT_BUCKET/" \
              || echo "::warning::Could not persist ${manifest} back to gs://$SNAPSHOT_BUCKET/ (deployer SA may lack write access) — continuing with the local copy for this deploy only."
          }
          backfill snapshots/emaff-fude-kagoshima.sqlite field \
            "eMAFF Fude Polygon" \
            "Source: Ministry of Agriculture, Forestry and Fisheries eMAFF Fude Polygon"
          backfill snapshots/famic-pesticide-2026.sqlite pesticide \
            "FAMIC pesticide registrations" \
            "Source: FAMIC pesticide registration information"

      - name: Snapshot freshness audit (hard gate)
        # Fails the deploy outright if a manifest is missing, stale (>90 days),
        # or its SHA-256/size no longer matches the .sqlite file — no
        # continue-on-error. The image build below bakes in exactly these
        # objects, so this is a true pre-build gate, not an advisory check.
        run: npm run snapshots:audit -- --max-age-days=90

      - name: Run deploy preflight
        run: |
          npm run deploy:preflight -- \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --deployer-service-account="$GCP_DEPLOYER_SERVICE_ACCOUNT" \
            --runtime-service-account="$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --snapshot-bucket="$SNAPSHOT_BUCKET" \
            --skip-billing

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Print Cloud Build auth context
        run: |
          echo "Active account: $(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Quota project: $(gcloud config get-value billing/quota_project 2>/dev/null || echo unset)"

      - name: Submit Cloud Build
        # Use --no-source so `gcloud builds submit` does not upload a source
        # tarball to the managed *_cloudbuild staging bucket. Some org policies
        # block that bucket path even when the deployer can start Cloud Build.
        # cloudbuild.remote.yaml clones this repository inside Cloud Build,
        # restores snapshots from GCS, then builds/deploys the image.
        env:
          CLOUDSDK_BILLING_QUOTA_PROJECT: ${{ env.PROJECT_ID }}
        run: |
          gcloud builds submit \
            --no-source \
            --config=cloudbuild.remote.yaml \
            --project=$PROJECT_ID \
            --substitutions=_REGION=$REGION,_REPO=$REPOSITORY,_MCP_BASE_URL=$MCP_BASE_URL,_SERVICE_ACCOUNT=$GCP_RUNTIME_SERVICE_ACCOUNT,_TOKEN_ENC_SECRET=agriops-token-enc-key,_SESSION_COOKIE_SECRET=agriops-session-cookie-secret,_SNAPSHOT_BUCKET=$SNAPSHOT_BUCKET,_GIT_SHA=$GITHUB_SHA

      - name: Print Cloud Run URL
        run: |
          gcloud run services describe $SERVICE \
            --region=$REGION --format='value(status.url)'

      - name: Mint Cloud Run identity token
        id: cloud-run-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.deploy-inputs.outputs.gcp_wif_provider }}
          service_account: ${{ steps.deploy-inputs.outputs.gcp_deployer_service_account }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy-inputs.outputs.mcp_base_url }}
          id_token_include_email: true

      - name: Smoke test Cloud Run
        run: |
          npm run deploy:smoke -- \
            --base-url="$MCP_BASE_URL" \
            --health-path=/livez \
            --expected-version="${{ steps.package.outputs.version }}" \
            --auth-bearer="${{ steps.cloud-run-auth.outputs.id_token }}"
