apiVersion: apps/v1
kind: Deployment
metadata:
  name: agriops-mcp
  labels:
    app: agriops-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agriops-mcp
  template:
    metadata:
      labels:
        app: agriops-mcp
    spec:
      containers:
        - name: server
          image: gcr.io/win-kagoshima/agriops-mcp:latest
          imagePullPolicy: IfNotPresent
          command:
            - "/nodejs/bin/node"
            - "/app/dist/server.js"
            - "--http"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
            - name: MCP_BASE_URL
              value: "http://agriops-mcp-service.default.svc.cluster.local:8080"
            - name: EMAFF_SNAPSHOT_PATH
              value: "/app/snapshots/emaff-fude-kagoshima.sqlite"
            - name: FAMIC_SNAPSHOT_PATH
              value: "/app/snapshots/famic-pesticide-2026.sqlite"
            - name: IOT_SNAPSHOT_PATH
              value: "/app/snapshots/iot-unified.sqlite"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: database-storage
              mountPath: /app/snapshots
      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: agriops-sqlite-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agriops-sqlite-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: agriops-mcp-service
spec:
  selector:
    app: agriops-mcp
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
